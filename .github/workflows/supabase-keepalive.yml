name: Supabase Keepalive

# Supabase's free tier pauses a project after 7 days with no database
# activity. This workflow writes to a small "heartbeat" table twice a
# week (comfortably under the 7-day limit) so the project never pauses.
on:
  schedule:
    - cron: "0 0 * * 0,3" # Sunday and Wednesday, 00:00 UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat row to Supabase
        run: |
          curl -sf -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\": 1, \"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
